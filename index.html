<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Двигатель V8 - Обучающий плакат</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container">
        <h1>WebAR Двигатель V8</h1>
        <p id="status">Инициализация AR...</p>
        <button id="startButton" style="display:none;">Запустить AR</button>
    </div>

    <!-- AR Container -->
    <div id="ar-container"></div>

    <!-- Import map для Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-three.prod.js"
        }
    }
    </script>
    
    <!-- Наш AR скрипт -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
